[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mooper"
version = "0.1.0"
description = "A lightweight, low-resource-friendly file conversion utility"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pillow",
    "av",
    "questionary",
    "tqdm",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
mooper = "mooper.cli:main"
